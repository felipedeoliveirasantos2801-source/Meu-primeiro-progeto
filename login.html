<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Camada escura que fica por cima da imagem para destacar o quadrado de login e não segar os olhos-->
    <div class="bg-overlay"></div>

    <!-- quadrado de login centralizado -->
    <div class="Seu-Email">
        
        <form class="form">
          <span class="Seus-Dados">
            <label for="email" class="label">Email</label>
            <input type="email" name="email" id="email" required />
          </span>
          
          <span class="Seus-Dados">
            <label for="Senha" class="label">Senha</label>
            <input type="password" name="Senha" id="Senha" required />
          </span>
          
          <span class="span"><a href="#">Esqueceu a senha?</a></span>
          <input class="submit" type="submit" value="Entrar" />
          <span class="span">Não tem uma conta? <a href="#">Cadastrar-Se</a></span>
        </form>

    </div>

</body>
</html>
